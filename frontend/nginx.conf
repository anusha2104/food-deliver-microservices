server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /restaurants {
        proxy_pass http://restaurant-service:8000;
    }

    location /orders {
        proxy_pass http://order-service:8001;
    }

    location /deliveries {
        proxy_pass http://delivery-service:8002;
    }
}
