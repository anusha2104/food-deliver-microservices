services:
  restaurant-service:
    build: 
      context: .
      dockerfile: restaurant-service/Dockerfile
    ports:
      - "8000:8000"

  order-service:
    build: 
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - restaurant-service
      - delivery-service
  delivery-service:
    build: 
      context: .
      dockerfile: delivery-service/Dockerfile
    ports:
      - "8002:8002" 